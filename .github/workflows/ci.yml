# CI — the enforcement substrate behind every "FROZEN" / "convention-only" guard.
# Runs the headless gates on every push/PR: typecheck, the golden/determinism suite
# (which now includes the seed-chain, facts, production-seed, core-boundary, surface-
# nets, quadtree-cut and digest goldens), and the production build. The VISUAL gates
# (locked 60fps, day/night, no jitter) still need a real WebGPU GPU and are NOT run
# here — software WebGPU can't judge them (see HANDOFF "Gate honesty").
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (golden / determinism, headless)
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build
